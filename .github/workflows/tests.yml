name: Tests
on: [push, pull_request]
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt -r requirements-delta.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests -v
        working-directory: ota
      - run: python ota/zigbee_ota_generator.py --help
      - run: python ota/delta_ota.py --help
